<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>InstaGive - Gewinnspiel Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--grad:linear-gradient(135deg,#f58529 0%,#dd2a7b 50%,#515bd4 100%);--bg:#faf7f9;--card:#fff;--text:#1a1a1a;--muted:#8a8a9a;--border:#f0e6ef;--green:#10b981;--red:#ef4444}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  .app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:90px}
  header{padding:28px 20px 24px;background:var(--grad);color:white;border-radius:0 0 28px 28px;position:sticky;top:0;z-index:10}
  header h1{font-size:24px;font-weight:800}
  header p{opacity:.9;font-size:13px;margin-top:4px}
  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:16px 20px 0}
  .stat{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:0 4px 20px rgba(0,0,0,.04);border:1px solid var(--border)}
  .stat b{font-size:22px;display:block} .stat span{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600;letter-spacing:.6px}
  .form-wrap{padding:16px 20px}
  .card{background:var(--card);border-radius:20px;padding:18px;box-shadow:0 8px 30px rgba(0,0,0,.06);border:1px solid var(--border)}
  .form-title{font-weight:700;font-size:15px;margin-bottom:14px}
  .field{margin-bottom:12px} .field label{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;display:block}
  .input-row{display:flex;align-items:center;background:#f9f5f9;border:1.5px solid var(--border);border-radius:12px;overflow:hidden}
  .input-row:focus-within{border-color:#dd2a7b;background:#fff;box-shadow:0 0 0 4px rgba(221,42,123,.1)}
  .input-row .prefix{padding-left:14px;font-weight:700;color:#dd2a7b}
  .input-row input,.field input{width:100%;border:none;background:transparent;padding:13px 14px;font-size:15px;outline:none}
  .field input{background:#f9f5f9;border:1.5px solid var(--border);border-radius:12px}
  .field input:focus{background:#fff;border-color:#dd2a7b;box-shadow:0 0 0 4px rgba(221,42,123,.1)}
  .btn-main{width:100%;background:var(--grad);color:white;border:none;padding:14px;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer}
  .tabs{display:flex;gap:8px;padding:0 20px 12px;overflow:auto}
  .tab{white-space:nowrap;padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600;border:1.5px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer}
  .tab.active{background:var(--text);color:white;border-color:var(--text)}
  .list{padding:0 20px;display:flex;flex-direction:column;gap:12px}
  .giveaway{background:var(--card);border-radius:18px;padding:14px 16px;border:1px solid var(--border);position:relative;animation:pop .3s ease}
  @keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  .gw-top{display:flex;justify-content:space-between;gap:10px}
  .gw-account{font-weight:700;font-size:15px} .gw-account .at{color:#dd2a7b}
  .badge{font-size:11px;font-weight:700;padding:5px 9px;border-radius:20px}
  .badge-soon{background:#fef3c7;color:#92400e} .badge-today{background:#fde68a;color:#78350f}
  .badge-expired{background:#fee2e2;color:#991b1b} .badge-urgent{background:#fee2e2;color:#991b1b;animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
  .gw-prize{margin:8px 0 4px;font-size:14px} .gw-date{font-size:12px;color:var(--muted);margin-bottom:12px}
  .status-row{display:flex;gap:6px} .s-btn{flex:1;padding:8px 6px;border-radius:10px;font-size:12px;font-weight:700;border:1.5px solid var(--border);background:#fafafa;color:var(--muted);cursor:pointer}
  .s-btn.active-offen{background:#1a1a1a;color:white;border-color:#1a1a1a}
  .s-btn.active-gewonnen{background:#10b981;color:white;border-color:#10b981}
  .s-btn.active-verloren{background:#ef4444;color:white;border-color:#ef4444}
  .del{position:absolute;top:12px;right:12px;background:#fff0f0;border:none;width:28px;height:28px;border-radius:8px;color:#ef4444;cursor:pointer}
  .empty{text-align:center;padding:40px 20px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <header><h1>🎁 InstaGive</h1><p>Verpasse kein Gewinnspiel mehr</p></header>
  <div class="stats">
    <div class="stat"><b id="stat-offen">0</b><span>Offen</span></div>
    <div class="stat"><b id="stat-gewonnen">0</b><span>Gewonnen</span></div>
    <div class="stat"><b id="stat-total">0</b><span>Gesamt</span></div>
  </div>
  <div class="form-wrap"><div class="card">
    <div class="form-title">➕ Neues Gewinnspiel</div>
    <div class="field"><label>Instagram Account</label>
      <div class="input-row"><span class="prefix">@</span><input id="acc" placeholder="proteinworks"></div></div>
    <div class="field"><label>Gewinn</label><input id="prize" placeholder="z.B. 1x Whey Vanilla"></div>
    <div class="field"><label>Enddatum & Uhrzeit</label><input id="date" type="datetime-local"></div>
    <button class="btn-main" id="addBtn">Speichern</button>
  </div></div>
  <div class="tabs">
    <button class="tab active" data-filter="alle">Alle</button>
    <button class="tab" data-filter="offen">Offen</button>
    <button class="tab" data-filter="gewonnen">Gewonnen</button>
    <button class="tab" data-filter="abgelaufen">Abgelaufen</button>
  </div>
  <div class="list" id="list"></div>
</div>
<script>
const LS_KEY='instagive_giveaways_v2';
let giveaways=JSON.parse(localStorage.getItem(LS_KEY)||'[]');
let filter='alle';
const $=s=>document.getElementById(s);
const accEl=$('acc'),prizeEl=$('prize'),dateEl=$('date'),listEl=$('list');
function save(){localStorage.setItem(LS_KEY,JSON.stringify(giveaways));}
function formatDate(d){return new Date(d).toLocaleDateString('de-DE',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})+' Uhr';}
function getCountdown(end){
  const diff=new Date(end)-new Date();
  if(diff<=0) return {text:'Abgelaufen',type:'expired'};
  const days=Math.floor(diff/(1000*60*60*24)), hours=Math.floor((diff%(1000*60*60*24))/(1000*60*60)), mins=Math.floor((diff%(1000*60*60))/(1000*60));
  if(days>1) return {text:`Noch ${days}T ${hours}Std`,type:'soon'};
  if(days===1) return {text:`Morgen · ${hours}Std`,type:'today'};
  return {text: hours>0?`Heute · ${hours}Std ${mins}Min`:`Noch ${mins} Min!`,type:'urgent'};
}
function render(){
  giveaways.sort((a,b)=>new Date(a.end)-new Date(b.end)); save();
  $('stat-total').textContent=giveaways.length;
  $('stat-offen').textContent=giveaways.filter(g=>g.status==='offen'&&new Date(g.end)>new Date()).length;
  $('stat-gewonnen').textContent=giveaways.filter(g=>g.status==='gewonnen').length;
  let f=[...giveaways];
  if(filter==='offen') f=f.filter(g=>g.status==='offen'&&new Date(g.end)>new Date());
  if(filter==='gewonnen') f=f.filter(g=>g.status==='gewonnen');
  if(filter==='abgelaufen') f=f.filter(g=>new Date(g.end)<=new Date());
  if(!f.length){listEl.innerHTML=`<div class="empty"><div style="font-size:42px">✨</div><div style="font-weight:700;color:#1a1a1a;margin-top:8px">Nichts hier</div><div style="font-size:13px;margin-top:6px">${filter==='alle'?'Füg dein erstes Gewinnspiel hinzu':'Kein Gewinnspiel in diesem Filter'}</div></div>`;return;}
  listEl.innerHTML=f.map(g=>{const cd=getCountdown(g.end);return `<div class="giveaway"><button class="del" onclick="removeGiveaway('${g.id}')">✕</button><div class="gw-top"><div class="gw-account"><span class="at">@</span>${g.account}</div><span class="badge badge-${cd.type}">${cd.text}</span></div><div class="gw-prize">🎁 ${g.prize}</div><div class="gw-date">🗓 ${formatDate(g.end)}</div><div class="status-row"><button class="s-btn ${g.status==='offen'?'active-offen':''}" onclick="setStatus('${g.id}','offen')">Offen</button><button class="s-btn ${g.status==='gewonnen'?'active-gewonnen':''}" onclick="setStatus('${g.id}','gewonnen')">🏆 Gewonnen</button><button class="s-btn ${g.status==='verloren'?'active-verloren':''}" onclick="setStatus('${g.id}','verloren')">Nicht gewonnen</button></div></div>`}).join('');
}
function addGiveaway(){
  const account=accEl.value.trim().replace('@',''),prize=prizeEl.value.trim(),end=dateEl.value;
  if(!account||!prize||!end) return alert('Bitte alle Felder ausfüllen 🙏');
  giveaways.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),account,prize,end,status:'offen'});
  accEl.value='';prizeEl.value='';render(); if(navigator.vibrate) navigator.vibrate(30);
}
window.setStatus=(id,s)=>{const g=giveaways.find(x=>x.id===id);if(g){g.status=s;render();}};
window.removeGiveaway=id=>{if(confirm('Wirklich löschen?')){giveaways=giveaways.filter(x=>x.id!==id);render();}};
$('addBtn').addEventListener('click',addGiveaway);
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render();}));
setInterval(render,30000); render();
const t=new Date(); t.setDate(t.getDate()+1); t.setHours(18,0,0,0);
dateEl.value=new Date(t.getTime()-t.getTimezoneOffset()*60000).toISOString().slice(0,16);
</script>
</body>
</html>
